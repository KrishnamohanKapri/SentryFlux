apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentryflux-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:KrishnamohanKapri/SentryFlux.git'
    targetRevision: HEAD
    path: IaC/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true